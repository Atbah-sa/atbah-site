 tc.addEventListener('click',e=>{const c=e.target.closest('.type');if(c)openType(c.dataset.t);});tc.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.type');if(c)openType(c.dataset.t);}});}
const modal=$('modal');let mType=null;

 const us=U.filter(x=>x.t===k),av=us.filter(x=>x.s==='ok'&&x.p);

 $('mRooms').innerHTML=(T.rooms||[]).map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')||(T.floors||[]).map(f=>`<tr><td>${esc(f[0])}</td><td style="direction:rtl;white-space:normal;font-weight:500;color:var(--ink)">${esc(f[1])}</td></tr>`).join('');

 $('mShow').hidden=!us.length;modal.classList.add('on');$('mClose').focus();}

<script>
(function(){
const Zm=document.getElementById('zoomer'),Zi=document.getElementById('zImg'),pct=document.getElementById('zPct');let s=1,x=0,y=0,fit=1;const pts=new Map();let last=null,pd=0;
function apply(){Zi.style.transform=`translate(${x}px,${y}px) scale(${s})`;pct.textContent=Math.round(s/fit*100)+'%';}
function doFit(){const W=innerWidth,H=innerHeight-140,iw=Zi.naturalWidth||1,ih=Zi.naturalHeight||1;fit=Math.min(W/iw,H/ih)*.94;s=fit;x=(innerWidth-iw*s)/2;y=60+(H-ih*s)/2;apply();}
function zoomAt(k,cx,cy){const ns=Math.min(fit*8,Math.max(fit*.6,s*k));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;apply();}
function open(src,title){Zi.onload=doFit;Zi.src=src;document.getElementById('zTitle').textContent=title||'المخطط';Zm.classList.add('on');if(Zi.complete)doFit();}
function close(){Zm.classList.remove('on');}
window.YZOOM=open;
document.getElementById('mPlan').addEventListener('click',e=>open(e.currentTarget.src,document.getElementById('mTitle').textContent));
document.getElementById('zClose').onclick=close;document.getElementById('zFit').onclick=doFit;
document.getElementById('zIn').onclick=()=>zoomAt(1.4,innerWidth/2,innerHeight/2);document.getElementById('zOut').onclick=()=>zoomAt(1/1.4,innerWidth/2,innerHeight/2);
Zm.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});
Zi.addEventListener('dblclick',e=>zoomAt(s/fit>1.6?fit/s:2.5,e.clientX,e.clientY));
Zm.addEventListener('pointerdown',e=>{if(e.target.closest('.zbar,.zt'))return;pts.set(e.pointerId,e);Zm.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY];});
Zm.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)zoomAt(d/pd,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);pd=d;return;}x+=e.clientX-last[0];y+=e.clientY-last[1];last=[e.clientX,e.clientY];apply();});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pd=0;const r=pts.values().next().value;if(r)last=[r.clientX,r.clientY];};Zm.addEventListener('pointerup',up);Zm.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(!Zm.classList.contains('on'))return;if(e.key==='Escape'){e.stopImmediatePropagation();close();}},true);
addEventListener('resize',()=>{if(Zm.classList.contains('on'))doFit();});
})();
</script>
<script>
(function(){
const C=CFG,f=document.getElementById('rq'),msg=document.getElementById('rqMsg'),btn=document.getElementById('rqBtn'),uIn=document.getElementById('rqUnit');
function pre(c){if(c!=null){uIn.value=c;}document.getElementById('request').scrollIntoView({behavior:'smooth'});setTimeout(()=>f.elements['name'].focus({preventScroll:true}),400);}
document.addEventListener('click',e=>{const a=e.target.closest('[data-req]');if(a){e.preventDefault();pre(a.dataset.req);}});
const qs=new URLSearchParams(location.search),utm={};[['utm_source','source'],['utm_medium','medium'],['utm_campaign','campaign'],['utm_content','content']].forEach(([k,v])=>{if(qs.get(k))utm[v]=qs.get(k).slice(0,120);});
const cid=qs.get('ScCid')||qs.get('sccid')||qs.get('ttclid')||qs.get('gclid')||qs.get('fbclid');if(cid)utm.click_id=cid.slice(0,160);utm.landing=C.path;if(document.referrer)utm.referrer=document.referrer.slice(0,160);
f.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';
  const E=f.elements,name=E['name'].value.trim(),phone=E['phone'].value.replace(/[\s-]/g,''),unit=uIn.value.trim().toUpperCase(),budget=+E['budget'].value.replace(/[^0-9]/g,'')||null;
  if(name.length<2){msg.className='msg err';msg.textContent='اكتب اسمك.';E['name'].focus();return;}
  if(!/^(05\d{8}|\+?9665\d{8})$/.test(phone)){msg.className='msg err';msg.textContent='رقم الجوال يبدأ بـ 05 ويتكون من 10 أرقام.';E['phone'].focus();return;}
  if(!E['consent'].checked){msg.className='msg err';msg.textContent='نحتاج موافقتك على حفظ البيانات للتواصل معك.';return;}
  btn.disabled=true;msg.textContent='جارٍ الإرسال…';
  const rec={name,phone,city:C.city,budget,role:'buyer',note:'مشروع '+C.name+' — '+C.district+(unit?' · الوحدة '+unit:''),wishes:{district:C.district,ptype:C.ptype},utm,
    consent_text_ver:'phase0-v3',consent_lang:'ar',marketing_consent:false,source:'project-'+C.slug+(unit?'-'+unit.toLowerCase():'')};
  try{const r=await fetch('/api/interest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});const d=await r.json().catch(()=>({}));
    if(r.ok){f.reset();msg.className='msg ok';msg.textContent='وصل طلبك'+(d.ref?' (المرجع '+d.ref+')':'')+'. نتصل بك خلال يومي عمل.';try{window.va&&window.va('event',{name:C.slug+'_request_submit'});}catch(_){}}
    else if(r.status===429){msg.className='msg err';msg.textContent='محاولات كثيرة. حاول بعد دقائق أو راسلنا في واتساب.';}
    else{msg.className='msg err';msg.textContent='تعذّر الإرسال الآن. راسلنا في واتساب على ‎+966 55 954 7274.';}
  }catch(_){msg.className='msg err';msg.textContent='تعذّر الاتصال. راسلنا في واتساب على ‎+966 55 954 7274.';}
  btn.disabled=false;});
})();
</script>
<style>
/* photo lightbox 10-17: click any photo to enlarge; arrows/swipe between photos of the same section */
.gal img,.dev>img,.mapcard img,.aerial img{cursor:zoom-in}
.lbx{position:fixed;inset:0;z-index:45;background:rgba(9,24,21,.96);display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y}
.lbx.on{display:flex}
.lbx figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;padding:0 12px}
.lbx img{max-width:min(1500px,96vw);max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
.lbx figcaption{color:#F1ECE3;font-size:15px;text-align:center;min-height:1.4em}
.lbx .top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;color:#F1ECE3;font-size:14px}
.lbx button{font:inherit;cursor:pointer;color:#F1ECE3;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px}
.lbx .x{padding:7px 16px;font-weight:600}
.lbx .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;font-size:26px;line-height:1;display:grid;place-items:center}
.lbx .nav.nx{left:14px}.lbx .nav.pv{right:14px}
.lbx .nav[hidden]{display:none}
@media(max-width:640px){.lbx .nav{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:none}.lbx img{max-height:calc(100vh - 190px)}}
</style>
<div class="lbx" id="lbx" role="dialog" aria-modal="true" aria-label="عرض الصورة"><div class="top"><span id="lbxN" class="num"></span><button type="button" class="x" id="lbxX">إغلاق ✕</button></div>
<button type="button" class="nav pv" id="lbxP" aria-label="الصورة السابقة">›</button><figure><img id="lbxI" alt=""><figcaption id="lbxC"></figcaption></figure><button type="button" class="nav nx" id="lbxNx" aria-label="الصورة التالية">‹</button></div>
<script>
(function(){
const SEL='.gal img,.dev>img,.mapcard img,.aerial img';
const B=document.getElementById('lbx'),I=document.getElementById('lbxI'),C=document.getElementById('lbxC'),N=document.getElementById('lbxN'),P=document.getElementById('lbxP'),Nx=document.getElementById('lbxNx');
let list=[],i=0,last=null;
const cap=im=>{const f=im.closest('figure');const fc=f&&f.querySelector('figcaption');return (fc&&fc.textContent)||im.alt||'';};
function show(){const im=list[i];I.src=im.currentSrc||im.src;I.alt=im.alt||'';C.textContent=cap(im);N.textContent=list.length>1?`${i+1} / ${list.length}`:'';P.hidden=Nx.hidden=list.length<2;}
function open(im){const sec=im.closest('section')||document;list=[...sec.querySelectorAll(SEL)].filter(x=>x.getAttribute('src'));i=Math.max(0,list.indexOf(im));last=document.activeElement;show();B.classList.add('on');document.documentElement.style.overflow='hidden';document.getElementById('lbxX').focus();}
function close(){B.classList.remove('on');document.documentElement.style.overflow='';if(last&&last.focus)last.focus();}
const go=d=>{if(list.length<2)return;i=(i+d+list.length)%list.length;show();};
document.addEventListener('click',e=>{const im=e.target.closest(SEL);if(!im||e.target.closest('.lbx'))return;if(im.closest('.type')){return;}e.preventDefault();open(im);});
document.addEventListener('keydown',e=>{const im=e.target.closest&&e.target.closest(SEL);if(im&&(e.key==='Enter'||e.key===' ')){e.preventDefault();open(im);}});
document.getElementById('lbxX').onclick=close;P.onclick=()=>go(-1);Nx.onclick=()=>go(1);
B.addEventListener('click',e=>{if(e.target===B||e.target.tagName==='FIGURE')close();});
I.addEventListener('click',()=>{if(window.YZOOM){const s=I.src,c=C.textContent;close();window.YZOOM(s,c);}});
addEventListener('keydown',e=>{if(!B.classList.contains('on'))return;if(e.key==='Escape'){e.stopImmediatePropagation();close();}else if(e.key==='ArrowLeft')go(1);else if(e.key==='ArrowRight')go(-1);},true);
let sx=null;B.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});B.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx>0?1:-1);sx=null;},{passive:true});
// make photos keyboard-focusable
const tag=()=>document.querySelectorAll(SEL).forEach(im=>{if(!im.closest('.type')&&!im.hasAttribute('tabindex')){im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','تكبير الصورة: '+(im.alt||''));}});
tag();setTimeout(tag,3000);
})();
</script>
